name: Supabase Keep Alive

on:
  schedule:
    # Runs approximately every 5 days at 07:00 UTC
    - cron: "0 7 */5 * *"

  # Allows manual testing
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Update Supabase keep-alive record
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |
          echo "Updating CampusCare keep-alive record..."

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X PATCH \
            "${SUPABASE_URL}/rest/v1/sensor_readings?sensor_id=eq.000250da-af1c-4805-996c-3234d7a5a721" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data '{"occupancy_level":0}')

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Supabase keep-alive update successful."
            cat response.json
          else
            echo "Supabase update failed."
            cat response.json
            exit 1
          fi
